[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "speech-pipeline"
version = "0.1.0"
description = "VAD + speaker diarization + ASR pipeline (first stage of a voice agent)"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "soundfile",
    "pyyaml",
    "sherpa-onnx>=1.10",
    "faster-whisper>=1.1",
    # CUDA 12 libraries that faster-whisper (CTranslate2) needs to run on the GPU
    "nvidia-cublas-cu12; platform_system != 'Darwin'",
    "nvidia-cudnn-cu12>=9,<10; platform_system != 'Darwin'",
]

[tool.setuptools.packages.find]
where = ["src"]